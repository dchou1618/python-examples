name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$RELEASE_TAG" = "v$project_version"

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(git tag --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -n 1)
          {
            echo "## What's Changed"
            if [ -n "$previous_tag" ]; then
              git log --format='- %s (%h)' "$previous_tag..$RELEASE_TAG"
            else
              git log --format='- %s (%h)' "$RELEASE_TAG"
            fi
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${previous_tag}...${RELEASE_TAG}"
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --notes-file release-notes.md

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*