name: garak LLM security scan

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 6"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GARAK_ALLOW_SKIP: "1"
      GARAK_MODEL_TYPE: ${{ secrets.GARAK_MODEL_TYPE }}
      GARAK_MODEL_NAME: ${{ secrets.GARAK_MODEL_NAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run garak scan
        run: ./security/garak/run_scan.sh